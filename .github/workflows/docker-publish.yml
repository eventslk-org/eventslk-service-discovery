name: Docker Build and Publish

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  # github.repository returns username/repo (e.g., your-username/DeviceLK-ServiceDiscovery)
  IMAGE_NAME: ${{ github.repository }}
  # You can also hardcode it to your Docker Hub username/repo
  # IMAGE_NAME: your-dockerhub-username/devicelk-discovery-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      # Only run this step if it's not a pull request, as PRs shouldn't push to registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        # These secrets need to be configured in your GitHub repository settings
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Set latest tag for default branch
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        # Push only if it's not a pull request
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Use caching to speed up future builds
        cache-from: type=gha
        cache-to: type=gha,mode=max
