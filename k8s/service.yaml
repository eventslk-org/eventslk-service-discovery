apiVersion: v1
kind: Service
metadata:
  name: devicelk-discovery
  namespace: devicelk
spec:
  clusterIP: None
  selector:
    app: devicelk-discovery
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: devicelk-discovery-ui
  namespace: devicelk
spec:
  type: ClusterIP
  selector:
    app: devicelk-discovery
  ports:
    - name: http
      port: 8761
      targetPort: 8761
